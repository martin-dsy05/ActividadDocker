name: CI - Actividad Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar herramientas de prueba
        run: pip install pytest coverage

      - name: Ejecutar pruebas y calcular cobertura
        run: |
          coverage run -m pytest
          coverage report

      - name: Construir imagen Docker
        run: docker build -t calculadora-python .