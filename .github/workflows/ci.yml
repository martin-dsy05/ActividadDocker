name: Validacion de compilacion Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validacion:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verificar instalacion de Python
        run: python --version

      - name: Construir imagen Docker
        run: docker build -t calculadora-python .